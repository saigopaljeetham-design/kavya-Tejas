name: Copy Kavya & Tejas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project-2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        run: |
          git clone --depth 1 https://github.com/sandy537/kavya-Tejas.git /tmp/kavya-tejas
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kavya-tejas/. .
          rm -rf .github/workflows/copy-kavya-tejas.yml

      - name: Commit source repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy Kavya & Tejas wedding invitation" || exit 0
          git push origin HEAD:main --force
