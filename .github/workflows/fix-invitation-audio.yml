name: Fix invitation audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the actual invitation page
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('src/app/page.tsx')
          text = page.read_text()

          text = text.replace(
              'import { ArrowUpRight, CalendarDays, MapPin, Volume2, VolumeX } from "lucide-react";',
              'import { ArrowUpRight, CalendarDays, MapPin } from "lucide-react";'
          )
          text = text.replace(
              'const [opened,setOpened]=useState(false),[music,setMusic]=useState(false),[language,setLanguage]=useState<"EN"|"TE">("EN");',
              'const [opened,setOpened]=useState(false),[language,setLanguage]=useState<"EN"|"TE">("EN");'
          )
          text = re.sub(r' const toggleMusic=async\(\)=>\{.*?\};\n', '', text, count=1)
          text = text.replace(
              '<audio ref={audioRef} loop preload="none" src={weddingConfig.music.source}/>',
              '<audio ref={audioRef} loop preload="auto" src={weddingConfig.music.source}/>'
          )
          text = text.replace(
              '{!opened&&<CinematicEnvelope onOpen={()=>setOpened(true)}/>} ',
              '{!opened&&<CinematicEnvelope onOpen={()=>{const a=audioRef.current;if(a){a.volume=0;void a.play().catch(()=>{});}setOpened(true)}}/>} '
          )
          text = re.sub(
              r'<button aria-label="Toggle music" onClick=\{toggleMusic\}>\{music\?\<Volume2 size=\{16\}/\>:<VolumeX size=\{16\}/\>\}</button>',
              '',
              text,
              count=1,
          )
          page.write_text(text)

          env = Path('src/components/invitation/CinematicEnvelope.tsx')
          etext = env.read_text()
          old = '''  const open = () => {\n    if (opening) return;\n    setOpening(true);\n    window.setTimeout(onOpen, 900);\n  };'''
          new = '''  const open = () => {\n    if (opening) return;\n    // Start audio directly inside the seal/envelope tap. Browser autoplay\n    // policies allow audible playback when it is initiated by user input.\n    const audio = document.querySelector<HTMLAudioElement>(\".luxury-invitation > audio\");\n    if (audio) {\n      audio.volume = 0;\n      void audio.play().catch(() => {});\n    }\n    setOpening(true);\n    window.setTimeout(onOpen, 900);\n  };'''
          if old not in etext:
              raise SystemExit('Expected envelope open handler was not found')
          env.write_text(etext.replace(old, new, 1))

      - name: Commit actual source changes and remove this patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/components/invitation/CinematicEnvelope.tsx
          git rm .github/workflows/fix-invitation-audio.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix envelope-triggered wedding audio"
          git push
